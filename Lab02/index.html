<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiante - Sistema de Gestión Académica</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <form action="/procesar" method="POST" class="form-container">
    <h1>Registro de Estudiante</h1>

    <fieldset>
      <legend>Información Personal</legend>

      <div class="form-group">
        <label for="nombre" class="form-label">Nombres Completos:</label>
        <input type="text" id="nombre" name="nombre" class="form-input"
               required minlength="3" maxlength="60"
               placeholder="Ej: Juan Pérez Quispe">
      </div>

      <div class="form-group">
        <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" class="form-input"
               required>
      </div>

      <div class="form-group">
        <label for="edad" class="form-label">Edad:</label>
        <input type="number" id="edad" name="edad" class="form-input"
               required min="16" max="60"
               placeholder="Ej: 18">
      </div>

      <div class="form-group">
        <span class="form-label">Turno:</span>
        <label class="radio-label">
          <input type="radio" name="turno" value="manana" required> Mañana
        </label>
        <label class="radio-label">
          <input type="radio" name="turno" value="tarde" required> Tarde
        </label>
        <label class="radio-label">
          <input type="radio" name="turno" value="noche" required> Noche
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Información de la Cuenta</legend>

      <div class="form-group">
        <label for="codigo" class="form-label">Código de Estudiante:</label>
        <input type="text" id="codigo" name="codigo" class="form-input"
               required
               placeholder="Ej: 20231234">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Correo Institucional:</label>
        <input type="email" id="email" name="email" class="form-input"
               required placeholder="usuario@universidad.edu.pe">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña:</label>
        <input type="password" id="password" name="password" class="form-input"
               required>
      </div>

      <div class="form-group">
        <label for="carrera" class="form-label">Carrera Profesional:</label>
        <select id="carrera" name="carrera" class="form-input" required>
          <option value="">-- Seleccione una carrera --</option>
          <option value="sistemas">Ingeniería de Sistemas</option>
          <option value="civil">Ingeniería Civil</option>
          <option value="industrial">Ingeniería Industrial</option>
          <option value="electronica">Ingeniería Electrónica</option>
        </select>
      </div>

      <div class="form-group">
        <label for="comentarios" class="form-label">Comentarios:</label>
        <textarea id="comentarios" name="comentarios" class="form-input"
                  rows="4" maxlength="300"
                  placeholder="Escribe algún comentario adicional (opcional)"></textarea>
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" name="terminos" required>
          Acepto los Términos y Condiciones
        </label>
      </div>
    </fieldset>

    <div class="form-group">
      <button type="submit" class="btn-submit">Registrarse</button>
    </div>

  </form>

</body>
</html>
