<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Tareas Universitarias</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos propios (después de Bootstrap para poder complementarlo) -->
  <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-light">
 
  <header class="bg-primary text-white text-center py-4 mb-4">
    <div class="container">
      <h1 class="h2 fw-bold mb-1">Gestor de Tareas Universitarias</h1>
      <p class="mb-0 opacity-75">Organiza tus entregas por curso y fecha</p>
    </div>
  </header>
 
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
 
        <!-- Formulario -->
        <section class="card border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">Nueva tarea</h2>
 
            <div id="alertas" aria-live="polite"></div>
 
            <form id="tarea-form" novalidate>
              <div class="row g-3">
                <div class="col-12">
                  <label for="titulo" class="form-label">Título</label>
                  <input type="text" id="titulo" class="form-control" placeholder="Ej. Informe del Laboratorio 4">
                </div>
                <div class="col-md-6">
                  <label for="curso" class="form-label">Curso</label>
                  <input type="text" id="curso" class="form-control" placeholder="Ej. Introducción al Desarrollo Web">
                </div>
                <div class="col-md-6">
                  <label for="fecha" class="form-label">Fecha de entrega</label>
                  <input type="date" id="fecha" class="form-control">
                </div>
                <div class="col-12 d-grid d-md-flex justify-content-md-end">
                  <button type="submit" class="btn btn-primary px-4">Agregar tarea</button>
                </div>
              </div>
            </form>
          </div>
        </section>
 
        <!-- Lista de tareas -->
        <section class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
              <h2 class="h5 mb-0">Mis tareas</h2>
              <div id="filtros" class="btn-group" role="group" aria-label="Filtrar tareas">
                <button type="button" class="btn btn-outline-primary active" data-filtro="todas">Todas</button>
                <button type="button" class="btn btn-outline-primary" data-filtro="pendientes">Pendientes</button>
                <button type="button" class="btn btn-outline-primary" data-filtro="completadas">Completadas</button>
              </div>
            </div>
 
            <p id="estadisticas" class="text-muted small"></p>
            <ul id="lista-tareas" class="list-group list-group-flush"></ul>
          </div>
        </section>
 
      </div>
    </div>
  </main>
 
  <footer class="text-center text-muted small py-4 mt-2">
    Laboratorio 04 · Introducción al Desarrollo Web · UNSA
  </footer>
 
  <script src="app.js" defer></script>
</body>
</html>
